<!-- Dark Mode Toggle Button HTML -->
<!-- Add this to your header section where the toggle should appear -->

<!-- Option 1: Simple button with icon -->
<button id="theme-toggle" 
        class="theme-toggle" 
        data-theme-toggle 
        aria-label="Toggle dark mode" 
        aria-pressed="false"
        title="Switch to dark mode">
  🌙
</button>

<!-- Option 2: More detailed button with text -->
<button class="theme-toggle" 
        data-theme-toggle 
        aria-label="Toggle dark mode"
        aria-pressed="false">
  <span class="theme-toggle-icon">🌙</span>
  <span class="theme-toggle-text">Dark Mode</span>
</button>

<!-- Option 3: Switch-style toggle -->
<div class="theme-toggle-wrapper">
  <label class="theme-toggle-switch">
    <input type="checkbox" 
           data-theme-toggle 
           aria-label="Toggle dark mode"
           class="theme-toggle-input">
    <span class="theme-toggle-slider"></span>
  </label>
  <span class="theme-toggle-label">Dark Mode</span>
</div>

<!-- CSS for the switch style (add to your CSS file) -->
<style>
.theme-toggle-switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 24px;
}

.theme-toggle-input {
  opacity: 0;
  width: 0;
  height: 0;
}

.theme-toggle-slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: var(--border-color);
  transition: 0.3s;
  border-radius: 24px;
}

.theme-toggle-slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: var(--bg-color);
  transition: 0.3s;
  border-radius: 50%;
}

.theme-toggle-input:checked + .theme-toggle-slider {
  background-color: var(--accent-color);
}

.theme-toggle-input:checked + .theme-toggle-slider:before {
  transform: translateX(26px);
}

.theme-toggle-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
}

.theme-toggle-label {
  font-size: 14px;
  color: var(--text-color);
}
</style>
