<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oven Safety Check - Nebraska Cornhuskers</title>
    <link rel="icon" type="image/png" href="images/favicon-rhuleaid.png">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* MOBILE MENU - COMPLETE OVERRIDE WITH MAXIMUM SPECIFICITY */
        
        /* Hide mobile toggle by default, show only on mobile */
        .mobile-menu-toggle {
            display: none;
        }
        
        @media screen and (max-width: 768px) {
            /* Force show mobile toggle button - right aligned */
            .mobile-menu-toggle {
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                background: rgba(255,255,255,0.2) !important;
                border: 2px solid white !important;
                color: white !important;
                padding: 12px !important;
                border-radius: 8px !important;
                cursor: pointer !important;
                font-size: 18px !important;
                font-weight: bold !important;
                min-width: 48px !important;
                min-height: 48px !important;
                z-index: 10001 !important;
                margin-left: auto !important;
            }
            
            /* Ensure header actions are right-aligned */
            .header-actions {
                display: flex !important;
                gap: 10px !important;
                align-items: center !important;
                margin-left: auto !important;
            }
            
            /* Hide desktop navigation on mobile */
            body .site-header .header-content .header-left .site-nav {
                display: none !important;
                position: absolute !important;
                top: 100% !important;
                right: 0 !important;
                left: auto !important;
                background: #dc2626 !important;
                padding: 20px !important;
                border-radius: 0 0 15px 15px !important;
                box-shadow: 0 8px 25px rgba(0,0,0,0.4) !important;
                z-index: 10000 !important;
                margin: 0 !important;
                width: 280px !important;
                max-width: 90vw !important;
                box-sizing: border-box !important;
                transform: translateX(100%) !important;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            }
            
            /* Show navigation when active - slide in from right */
            body .site-header .header-content .header-left .site-nav.mobile-active {
                display: block !important;
                transform: translateX(0) !important;
            }
            
            /* Force navigation list to be vertical and left-aligned */
            body .site-header .header-content .header-left .site-nav ul {
                display: block !important;
                flex-direction: column !important;
                gap: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
                list-style: none !important;
                text-align: left !important;
                align-items: stretch !important;
                justify-content: flex-start !important;
            }
            
            /* Force navigation items to be full width blocks */
            body .site-header .header-content .header-left .site-nav li {
                display: block !important;
                margin: 0 0 8px 0 !important;
                width: 100% !important;
                text-align: left !important;
            }
            
            /* Force navigation links to be left-aligned blocks with slide animation */
            body .site-header .header-content .header-left .site-nav a {
                display: block !important;
                padding: 16px 20px !important;
                color: white !important;
                text-decoration: none !important;
                border-radius: 10px !important;
                text-align: left !important;
                background: rgba(0,0,0,0.1) !important;
                border: 1px solid transparent !important;
                width: 100% !important;
                box-sizing: border-box !important;
                margin: 0 !important;
                font-size: 16px !important;
                font-weight: 500 !important;
                transition: all 0.2s ease !important;
                transform: translateX(0) !important;
            }
            
            /* Hover and active states with left slide effect */
            body .site-header .header-content .header-left .site-nav a:hover {
                background: rgba(255,255,255,0.15) !important;
                border-color: rgba(255,255,255,0.2) !important;
                transform: translateX(-8px) !important;
                box-shadow: 0 2px 8px rgba(0,0,0,0.2) !important;
            }
            
            body .site-header .header-content .header-left .site-nav a.active {
                background: rgba(255,255,255,0.25) !important;
                border-color: rgba(255,255,255,0.3) !important;
                font-weight: 600 !important;
                box-shadow: 0 2px 12px rgba(0,0,0,0.3) !important;
            }
            
            /* Ensure header container allows positioning */
            .site-header {
                position: relative !important;
            }
            
            .header-content {
                position: relative !important;
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
            }
            
            /* Adjust header left section for mobile */
            .header-left {
                display: flex !important;
                align-items: center !important;
                flex: 1 !important;
            }
        }

        .hero {
            background: linear-gradient(135deg, #d00000, #8b0000);
            color: white;
            padding: 80px 20px;
            text-align: center;
            margin-top: 0;
        }
        
        .main-content {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .safety-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
            margin-bottom: 30px;
        }
        
        .safety-status {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .safety-message {
            font-size: 1.8em;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .safety-reason {
            font-size: 1.2em;
            color: var(--secondary-text);
            margin-bottom: 30px;
        }
        
        .game-info {
            background: rgba(var(--accent-color-rgb), 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-color);
        }
        
        .game-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .detail-item {
            text-align: center;
        }
        
        .detail-label {
            font-size: 0.9em;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-weight: 600;
            color: var(--text-color);
            font-size: 1.1em;
        }
        
        .safe {
            color: #22c55e;
        }
        
        .not-safe {
            color: #ef4444;
        }
        
        .loading {
            color: var(--secondary-text);
        }
        
        @media (max-width: 768px) {
            .hero {
                padding: 60px 20px;
            }
            
            .safety-card {
                padding: 30px 20px;
            }
            
            .safety-status {
                font-size: 3em;
            }
            
            .safety-message {
                font-size: 1.5em;
            }
            
            .safety-reason {
                font-size: 1.1em;
            }
            
            .game-details {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="header-left">
                    <div class="site-logo">
                        <a href="index.html">
                            <img src="./images/logos/nebraska-logo.png" alt="Nebraska Logo" class="site-nav-logo">
                            <h1 class="site-title">Nebraska Cornhuskers</h1>
                        </a>
                    </div>
                    <nav class="site-nav" id="site-nav">
                        <ul>
                            <li><a href="index.html">🏠 Home</a></li>
                            <li><a href="schedule.html">📅 Schedule</a></li>
                            <li><a href="roster.html">👥 Roster</a></li>
                            <li><a href="news.html">📰 News</a></li>
                            <li><a href="rhule-aid.html">🍺 Rhule-aid</a></li>
                            <li><a href="gameday.html">🏈 Game Day</a></li>
                        </ul>
                    </nav>
                </div>
                <div class="header-actions">
                    <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle Dark Mode">
                        <span class="dark-mode-icon">🌙</span>
                    </button>
                    <button class="mobile-menu-toggle" 
                            id="mobile-menu-btn"
                            onclick="handleMobileMenuToggle(this)"
                            title="Toggle Navigation Menu">☰</button>
                </div>
            </div>
        </div>
    </header>

    <script>
        // BULLETPROOF MOBILE MENU FUNCTIONALITY
        
        // Global variables to prevent conflicts
        window.mobileMenuOpen = false;
        
        // Main toggle function
        function handleMobileMenuToggle(button) {
            console.log('Mobile menu toggle clicked');
            
            // Get elements with multiple fallback methods
            var nav = document.getElementById('site-nav') || document.querySelector('.site-nav') || document.querySelector('nav');
            var btn = button || document.getElementById('mobile-menu-btn') || document.querySelector('.mobile-menu-toggle');
            
            if (!nav) {
                console.error('Navigation element not found');
                return;
            }
            
            if (!btn) {
                console.error('Button element not found');
                return;
            }
            
            console.log('Elements found - nav:', nav, 'btn:', btn);
            
            // Toggle the menu
            if (window.mobileMenuOpen) {
                // Close menu
                nav.classList.remove('mobile-active');
                btn.innerHTML = '☰';
                btn.setAttribute('aria-expanded', 'false');
                window.mobileMenuOpen = false;
                console.log('Menu closed');
            } else {
                // Open menu
                nav.classList.add('mobile-active');
                btn.innerHTML = '✕';
                btn.setAttribute('aria-expanded', 'true');
                window.mobileMenuOpen = true;
                console.log('Menu opened');
            }
        }
        
        // Close menu when clicking outside
        function handleDocumentClick(event) {
            if (!window.mobileMenuOpen) return;
            
            var nav = document.getElementById('site-nav');
            var btn = document.querySelector('.mobile-menu-toggle');
            
            if (!nav || !btn) return;
            
            var clickedInsideNav = nav.contains(event.target);
            var clickedButton = btn.contains(event.target);
            
            if (!clickedInsideNav && !clickedButton) {
                nav.classList.remove('mobile-active');
                btn.innerHTML = '☰';
                btn.setAttribute('aria-expanded', 'false');
                window.mobileMenuOpen = false;
                console.log('Menu closed by outside click');
            }
        }
        
        // Close menu on window resize to desktop
        function handleWindowResize() {
            if (window.innerWidth > 768 && window.mobileMenuOpen) {
                var nav = document.getElementById('site-nav');
                var btn = document.querySelector('.mobile-menu-toggle');
                
                if (nav) nav.classList.remove('mobile-active');
                if (btn) {
                    btn.innerHTML = '☰';
                    btn.setAttribute('aria-expanded', 'false');
                }
                window.mobileMenuOpen = false;
                console.log('Menu closed by resize');
            }
        }
        
        // Initialize when DOM is ready
        function initMobileMenu() {
            console.log('Initializing mobile menu...');
            
            // Add event listeners
            document.addEventListener('click', handleDocumentClick);
            window.addEventListener('resize', handleWindowResize);
            
            // Set initial button state
            var btn = document.querySelector('.mobile-menu-toggle');
            if (btn) {
                btn.setAttribute('aria-expanded', 'false');
                btn.setAttribute('aria-controls', 'site-nav');
                console.log('Button initialized');
            }
            
            // Test elements
            var nav = document.getElementById('site-nav');
            console.log('Navigation found:', !!nav);
            console.log('Button found:', !!btn);
        }
        
        // Initialize on both DOMContentLoaded and load events for safety
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMobileMenu);
        } else {
            initMobileMenu();
        }
        
        window.addEventListener('load', function() {
            console.log('Window loaded, double-checking mobile menu...');
            var nav = document.getElementById('site-nav');
            var btn = document.querySelector('.mobile-menu-toggle');
            console.log('Final check - nav:', !!nav, 'btn:', !!btn);
        });
    </script>

    <div class="hero">
        <h1 style="font-size: 3.5em; margin: 0 0 20px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">🍛 Oven Safety Check</h1>
        
    </div>

    <div class="main-content">
        <div class="safety-card" id="safety-card">
            <div class="safety-status loading" id="safety-status">⏳</div>
            <div class="safety-message loading" id="safety-message">Checking Nebraska schedule...</div>
            <div class="safety-reason" id="safety-reason">Please wait while we analyze the game schedule</div>
            
            <div class="game-info" id="game-info" style="display: none;">
                <h3 style="margin: 0 0 15px 0; color: var(--accent-color);">Next/Current Game</h3>
                <div class="game-details" id="game-details">
                    <!-- Game details will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Load schedule and check safety on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkOvenSafety();
        });

        async function checkOvenSafety() {
            try {
                const response = await fetch('/api/schedule');
                const data = await response.json();
                const games = data.data || [];
                
                analyzeGameSafety(games);
            } catch (error) {
                console.error('Error loading schedule:', error);
                displayError();
            }
        }

        function analyzeGameSafety(games) {
            const today = new Date();
            const statusElement = document.getElementById('safety-status');
            const messageElement = document.getElementById('safety-message');
            const reasonElement = document.getElementById('safety-reason');
            const gameInfoElement = document.getElementById('game-info');
            const gameDetailsElement = document.getElementById('game-details');

            // Sort games by date to find the next/current game
            const sortedGames = games.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // Find today's game or the next upcoming game
            let relevantGame = null;
            let isToday = false;
            
            // First check if there's a game today
            for (const game of sortedGames) {
                const gameDate = new Date(game.date);
                const todayDateString = today.toDateString();
                const gameDateString = gameDate.toDateString();
                
                if (todayDateString === gameDateString) {
                    relevantGame = game;
                    isToday = true;
                    break;
                }
            }
            
            // If no game today, find the next upcoming game
            if (!relevantGame) {
                for (const game of sortedGames) {
                    const gameDate = new Date(game.date);
                    if (gameDate > today) {
                        relevantGame = game;
                        break;
                    }
                }
            }

            if (!relevantGame) {
                // No upcoming games found
                statusElement.textContent = '✅';
                statusElement.className = 'safety-status safe';
                messageElement.textContent = 'SAFE TO GO!';
                messageElement.className = 'safety-message safe';
                reasonElement.textContent = 'No upcoming Nebraska games scheduled.';
                return;
            }

            // Check if it's a home game
            const isHomeGame = relevantGame.isHome;
            const isNeutralGame = relevantGame.isNeutral;
            
            // Display game information
            gameInfoElement.style.display = 'block';
            gameDetailsElement.innerHTML = `
                <div class="detail-item">
                    <div class="detail-label">Date</div>
                    <div class="detail-value">${relevantGame.date}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Time</div>
                    <div class="detail-value">${relevantGame.time}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Opponent</div>
                    <div class="detail-value">${relevantGame.opponent}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Location</div>
                    <div class="detail-value">${relevantGame.location}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">TV</div>
                    <div class="detail-value">${relevantGame.tvNetwork}</div>
                </div>
            `;

            if (isHomeGame && isToday) {
                // Home game today - NOT SAFE
                statusElement.textContent = '🚫';
                statusElement.className = 'safety-status not-safe';
                messageElement.textContent = 'NOT SAFE!';
                messageElement.className = 'safety-message not-safe';
                reasonElement.textContent = 'Nebraska has a home game TODAY. Downtown will be packed with fans!';
            } else if (isHomeGame && !isToday) {
                // Home game coming up but not today
                const gameDate = new Date(relevantGame.date);
                const daysUntilGame = Math.ceil((gameDate - today) / (1000 * 60 * 60 * 24));
                
                if (daysUntilGame <= 3) {
                    statusElement.textContent = '⚠️';
                    statusElement.className = 'safety-status not-safe';
                    messageElement.textContent = 'CAUTION!';
                    messageElement.className = 'safety-message not-safe';
                    reasonElement.textContent = `Nebraska has a home game in ${daysUntilGame} day${daysUntilGame === 1 ? '' : 's'}. Consider avoiding downtown.`;
                } else {
                    statusElement.textContent = '✅';
                    statusElement.className = 'safety-status safe';
                    messageElement.textContent = 'SAFE TO GO!';
                    messageElement.className = 'safety-message safe';
                    reasonElement.textContent = `Next home game is in ${daysUntilGame} days. You're good for now!`;
                }
            } else {
                // Away or neutral game - SAFE
                statusElement.textContent = '✅';
                statusElement.className = 'safety-status safe';
                messageElement.textContent = 'SAFE TO GO!';
                messageElement.className = 'safety-message safe';
                
                if (isToday) {
                    reasonElement.textContent = `Nebraska is playing ${isNeutralGame ? 'at a neutral site' : 'away'} today. Downtown should be less crowded!`;
                } else {
                    reasonElement.textContent = `Next game is ${isNeutralGame ? 'at a neutral site' : 'away'}. Downtown should be manageable.`;
                }
            }
        }

        function displayError() {
            const statusElement = document.getElementById('safety-status');
            const messageElement = document.getElementById('safety-message');
            const reasonElement = document.getElementById('safety-reason');

            statusElement.textContent = '❓';
            statusElement.className = 'safety-status loading';
            messageElement.textContent = 'Unable to Check';
            messageElement.className = 'safety-message loading';
            reasonElement.textContent = 'Could not load Nebraska schedule. Please try again later.';
        }
    </script>
</body>
</html>
